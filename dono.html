<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus preços - Prime Postos</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14181f;--muted:#667085;--line:#e3e6eb;--fld:#eef1f5;--sh:0 6px 24px rgba(16,24,40,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#1a1f28;--text:#eef1f5;--muted:#9aa4b2;--line:#2a313d;--fld:#252d39;--sh:0 6px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#0a0a0a,#10301f);color:#fff;padding:18px 16px 22px;border-radius:0 0 28px 28px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:1.4rem}h1 b{color:#22c55e}
header button{color:#fff;font-size:.85rem;background:#ffffff22;padding:8px 14px;border-radius:99px;border:0;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--sh);margin-bottom:18px}
h2{margin:0 0 12px;font-size:1.1rem}
label{display:block;color:var(--muted);font-size:.8rem;font-weight:600;margin:0 0 4px}
input{width:100%;background:var(--fld);color:var(--text);border:0;border-radius:99px;padding:12px 16px;font-size:1rem}
.s{color:var(--muted);font-size:.85rem;margin:0}
.post{border-top:1px solid var(--line);padding:14px 0}.post:first-child{border-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.row{display:flex;gap:6px}.row input{min-width:0}
.mini{border:0;border-radius:99px;padding:8px 14px;background:linear-gradient(135deg,#15803d,#22c55e);color:#fff;font-weight:700;font-size:.8rem;cursor:pointer}
.hide{display:none}
</style></head><body>
<header><h1>prime <b>postos</b> · Meus preços</h1><button id="sair" type="button">Sair</button></header>
<main>
<div id="aviso" class="card hide"><h2>Acesso indisponível</h2><p class="s" id="txt"></p><p class="s"><a href="/">Voltar ao site</a></p></div>
<div id="app" class="hide"><div class="card"><h2>Meus postos</h2><div id="postos"></div></div></div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(url,body){var o=body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)};
return fetch(url,o).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok)throw new Error((d&&d.erro)||("Erro "+r.status));return d})})}
$("sair").onclick=function(){var ir=function(){location.href="/"};api("/api/logout",{}).then(ir).catch(ir)};
api("/api/dono/postos").then(function(d){
$("app").classList.remove("hide");
if(!d.postos.length){$("postos").innerHTML='<p class="s">Nenhum posto vinculado à sua conta ainda. Fale com o administrador.</p>';return}
$("postos").innerHTML=d.postos.map(function(p){var pr={};p.prices.forEach(function(x){pr[x.fuel]=x.price});
var campos=d.fuels.map(function(f){return '<div class="pf"><label>'+esc(f)+'</label><div class="row"><input inputmode="decimal" placeholder="0,00" value="'+(pr[f]!=null?String(pr[f]).replace(".",","):"")+'"><button class="mini" data-f="'+esc(f)+'">OK</button></div></div>'}).join("");
return '<div class="post" data-id="'+p.id+'"><b>'+esc(p.name)+'</b><div class="s">'+esc(p.city||"")+' · '+esc(p.brand||"")+'</div><div class="grid">'+campos+'</div></div>'}).join("")
}).catch(function(e){$("aviso").classList.remove("hide");$("txt").textContent=e.message});
$("postos").onclick=function(e){var t=e.target.closest("button[data-f]");if(!t)return;
var id=t.closest(".post").getAttribute("data-id");
api("/api/dono/preco",{station_id:Number(id),fuel:t.getAttribute("data-f"),price:t.closest(".pf").querySelector("input").value}).then(function(){t.textContent="Salvo";setTimeout(function(){t.textContent="OK"},1200)}).catch(function(x){alert(x.message)})};
})();
</script></body></html>
