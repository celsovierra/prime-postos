<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime Postos</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14181f;--muted:#667085;--line:#e3e6eb;--g:#16a34a;--gbg:#e3f6ea;--head:#111;--headtext:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#1a1f28;--text:#eef1f5;--muted:#9aa4b2;--line:#2a313d;--g:#3ddc97;--gbg:#12362a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--head);color:var(--headtext);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:1.5rem}h1 b{color:#22c55e}
select{background:#2a2f38;color:#fff;border:0;border-radius:99px;padding:8px 12px;font-size:.85rem}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:12px}
.chip{flex:none;padding:8px 16px;border-radius:99px;border:0;background:#2a2f38;color:#fff;font-size:.9rem;cursor:pointer}
.chip.on{background:#fff;color:#111;font-weight:600}
main{max-width:520px;margin:0 auto;padding:16px}
h2{font-size:1.1rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.ic{width:44px;height:44px;border-radius:50%;background:var(--gbg);display:grid;place-items:center;flex:none}
.inf{flex:1;min-width:0}.n{font-weight:600}.s{color:var(--muted);font-size:.82rem}
.pr{text-align:right}.pr small{display:block;color:var(--muted);font-size:.65rem;letter-spacing:.05em}.pr b{color:var(--g);font-size:1.2rem;white-space:nowrap}
.tag{background:var(--g);color:var(--bg);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:6px}
.best{border-color:var(--g)}
a{color:var(--g);font-weight:600;font-size:.82rem;text-decoration:none}
.badge{background:var(--g);color:var(--bg);font-weight:700;font-size:.8rem;padding:8px 10px;border-radius:99px;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:10px 0;color:var(--muted);font-size:.75rem;cursor:pointer}
nav button.on{color:var(--g);font-weight:700}
nav span{display:block;font-size:1.3rem}
.hide{display:none}
</style>
</head>
<body>
<header>
<div class="top"><h1>prime <b>postos</b></h1><select id="city"></select></div>
<div class="chips" id="fuels"></div>
</header>
<main>
<section id="tabMapa">
<h2>Postos próximos</h2>
<div id="list"></div>
</section>
<section id="tabPromo" class="hide">
<h2>Promoções</h2>
<div id="promos"></div>
</section>
</main>
<nav>
<button class="on" data-t="tabMapa"><span>📍</span>Mapa</button>
<button data-t="tabPromo"><span>🏷️</span>Promoções</button>
</nav>
<script>
// Dados de EXEMPLO. Troque por dados reais depois.
// posto: [nome, bandeira, endereço, dLat, dLng, gasolina, etanol, diesel, gnv, promo]
var CITIES={
"Teresina, PI":{c:[-5.0892,-42.8019],s:[
["Posto Centro","Rede A","Av. Frei Serafim",.004,.003,6.19,4.45,6.29,4.89,1],
["Posto Ininga","Rede B","Av. Ininga",.02,.03,6.09,4.39,6.19,null,0],
["Posto Dirceu","Rede C","Av. Pedro Almeida",-.03,.04,6.25,4.55,6.35,4.79,0],
["Posto Norte","Rede A","Av. Duque de Caxias",.05,-.01,5.99,4.29,6.15,null,1],
["Posto Marquês","Rede B","Av. Marquês de Paranaguá",-.01,-.02,6.15,4.49,6.25,4.85,0]],
p:[["-R$ 0,10","Terça Promocional","Posto Centro"],["5% cashback","Acumule pontos no app","Posto Norte"],["Menor preço","Gasolina abaixo de R$ 6,00","Posto Norte"]]},
"Fortaleza, CE":{c:[-3.7319,-38.5267],s:[
["Posto Aldeota","Rede A","Av. Dom Luís",.01,.01,6.39,4.69,6.49,4.99,1],
["Posto Meireles","Rede B","Av. Beira Mar",.015,.02,6.45,4.75,6.55,null,0],
["Posto Messejana","Rede C","Av. Washington Soares",-.04,.03,6.19,4.49,6.29,4.79,0]],
p:[["2x pontos","Pontos em dobro aos sábados","Posto Aldeota"]]},
"São Luís, MA":{c:[-2.5307,-44.3068],s:[
["Posto Renascença","Rede A","Av. Colares Moreira",.01,.015,6.49,4.85,6.59,null,0],
["Posto Cohama","Rede B","Av. Jerônimo",.03,.01,6.35,4.7,6.45,null,1]],
p:[["-R$ 0,05","Desconto na gasolina","Posto Cohama"]]},
"Recife, PE":{c:[-8.0476,-34.877],s:[
["Posto Boa Viagem","Rede A","Av. Boa Viagem",.02,.01,6.3,4.6,6.4,4.95,1],
["Posto Boa Vista","Rede B","Rua da Aurora",.005,-.01,6.22,4.52,6.32,4.85,0]],
p:[["GNV R$ 4,85","GNV econômico","Posto Boa Vista"]]}
};
var FUELS=[["Gasolina",5],["Etanol",6],["Diesel",7],["GNV",8]];
var st={city:Object.keys(CITIES)[0],fuel:5,pos:null};
var $=function(i){return document.getElementById(i)};
function dist(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);
return 2*R*Math.asin(Math.sqrt(h))}
function brl(v){return "R$ "+v.toFixed(2).replace(".",",")}
function render(){
var C=CITIES[st.city],ref=st.pos||C.c;
var rows=C.s.map(function(s){var la=C.c[0]+s[3],ln=C.c[1]+s[4];
return{n:s[0],b:s[1],a:s[2],la:la,ln:ln,p:s[st.fuel],pr:s[9],d:dist(ref[0],ref[1],la,ln)}})
.filter(function(r){return r.p!=null}).sort(function(a,b){return a.p-b.p});
var min=rows.length?rows[0].p:0;
var fn=FUELS.filter(function(f){return f[1]===st.fuel})[0][0].toUpperCase();
$("list").innerHTML=rows.length?rows.map(function(r){
var u="https://www.google.com/maps/dir/?api=1&destination="+r.la+","+r.ln;
return '<div class="card'+(r.p===min?' best':'')+'"><div class="ic">⛽</div><div class="inf"><div class="n">'+r.n+(r.pr?'<span class="tag">Promo</span>':'')+'</div><div class="s">'+r.a+' · '+r.b+' · '+r.d.toFixed(1).replace(".",",")+' km</div><a href="'+u+'" target="_blank" rel="noopener">Como chegar →</a></div><div class="pr"><small>'+fn+'</small><b>'+brl(r.p)+'</b></div></div>'}).join("")
:'<p class="s">Nenhum posto com esse combustível.</p>';
$("fuels").innerHTML=FUELS.map(function(f){return '<button class="chip'+(f[1]===st.fuel?' on':'')+'" data-f="'+f[1]+'">'+f[0]+'</button>'}).join("");
$("promos").innerHTML=C.p.map(function(p){return '<div class="card"><span class="badge">'+p[0]+'</span><div class="inf"><div class="n">'+p[1]+'</div><div class="s">⛽ '+p[2]+'</div></div></div>'}).join("");
}
$("city").innerHTML=Object.keys(CITIES).map(function(c){return "<option>"+c+"</option>"}).join("");
$("city").onchange=function(e){st.city=e.target.value;st.pos=null;render()};
$("fuels").onclick=function(e){var f=e.target.getAttribute("data-f");if(f){st.fuel=+f;render()}};
document.querySelector("nav").onclick=function(e){var b=e.target.closest("button");if(!b)return;
document.querySelectorAll("nav button").forEach(function(x){x.className=x===b?"on":""});
["tabMapa","tabPromo"].forEach(function(t){$(t).className=t===b.getAttribute("data-t")?"":"hide"})};
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(function(p){st.pos=[p.coords.latitude,p.coords.longitude];render()},function(){});
render();
</script>
</body>
</html>
