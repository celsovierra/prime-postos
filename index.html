<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime Postos</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14181f;--muted:#667085;--line:#e3e6eb;--g:#16a34a;--gbg:#e3f6ea;--head:#111;--headtext:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#1a1f28;--text:#eef1f5;--muted:#9aa4b2;--line:#2a313d;--g:#3ddc97;--gbg:#12362a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--head);color:var(--headtext);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:1.5rem}h1 b{color:#22c55e}
select{background:#2a2f38;color:#fff;border:0;border-radius:99px;padding:8px 12px;font-size:.85rem}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:12px}
.chip{flex:none;padding:8px 16px;border-radius:99px;border:0;background:#2a2f38;color:#fff;font-size:.9rem;cursor:pointer}
.chip.on{background:#fff;color:#111;font-weight:600}
main{max-width:520px;margin:0 auto;padding:16px}
h2{font-size:1.1rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.ic{width:44px;height:44px;border-radius:50%;background:var(--gbg);display:grid;place-items:center;flex:none}
.inf{flex:1;min-width:0}.n{font-weight:600}.s{color:var(--muted);font-size:.82rem}
.pr{text-align:right}.pr small{display:block;color:var(--muted);font-size:.65rem;letter-spacing:.05em}.pr b{color:var(--g);font-size:1.2rem;white-space:nowrap}
.tag{background:var(--g);color:var(--bg);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:6px}
.best{border-color:var(--g)}
a{color:var(--g);font-weight:600;font-size:.82rem;text-decoration:none}
.badge{background:var(--g);color:var(--bg);font-weight:700;font-size:.8rem;padding:8px 10px;border-radius:99px;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:10px 0;color:var(--muted);font-size:.75rem;cursor:pointer}
nav button.on{color:var(--g);font-weight:700}
nav span{display:block;font-size:1.3rem}
.hide{display:none}
.sel{display:flex;gap:8px;margin-top:10px}.sel select{flex:1;min-width:0}
.ad{position:relative;background:#0b0b0b;color:#fff;border-radius:18px;overflow:hidden;margin-bottom:16px}
.ad .slide{display:none}.ad .slide.on{display:block}
.ad .img{height:150px;background:#1c1c1c center/cover no-repeat}
.ad .body{padding:14px}.ad h3{margin:0 0 4px;font-size:1.1rem}.ad p{margin:0 0 12px;color:#c4c9d1;font-size:.88rem}
.ad .btns{display:flex;gap:8px}.ad .btns a{flex:1;text-align:center;padding:10px;border-radius:99px;border:1px solid #fff;color:#fff;font-size:.85rem}
.ad .btns a.w{background:#22c55e;border-color:#22c55e}
.ad .lbl{position:absolute;top:10px;right:10px;background:#000a;color:#ccc;font-size:.65rem;padding:3px 8px;border-radius:6px;letter-spacing:.05em}
.ad .dots{display:flex;justify-content:center;gap:6px;padding-bottom:10px}.ad .dots i{width:6px;height:6px;border-radius:50%;background:#555}.ad .dots i.on{background:#22c55e}
</style>
</head>
<body>
<header>
<div class="top"><h1>prime <b>postos</b></h1></div><div class="sel"><select id="uf"></select><select id="city"></select></div>
<div class="chips" id="fuels"></div>
</header>
<main>
<section id="tabMapa">
<div class="ad" id="ads"></div>
<h2>Postos próximos</h2>
<div id="list"></div>
</section>
<section id="tabPromo" class="hide">
<h2>Promoções</h2>
<div id="promos"></div>
</section>
</main>
<nav>
<button class="on" data-t="tabMapa"><span>📍</span>Mapa</button>
<button data-t="tabPromo"><span>🏷️</span>Promoções</button>
</nav>
<script>
var $=function(i){return document.getElementById(i)};
var API="https://servicodados.ibge.gov.br/api/v1/localidades/estados";
var st={fuel:"gasolina",pos:null,rows:[]};
var FUELS=[["Gasolina","gasolina"],["Etanol","etanol"],["Diesel","diesel"],["GNV","gnv"]];
function opts(el,list,sel){el.innerHTML=list.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===sel?' selected':'')+'>'+x[1]+'</option>'}).join("")}
function loadUF(){fetch(API+"?orderBy=nome").then(function(r){return r.json()}).then(function(l){
opts($("uf"),l.map(function(e){return [e.sigla,e.nome]}),"PI");loadCities()})}
function loadCities(){$("city").innerHTML="<option>Carregando…</option>";
fetch(API+"/"+$("uf").value+"/municipios?orderBy=nome").then(function(r){return r.json()}).then(function(l){
opts($("city"),l.map(function(m){return [m.nome,m.nome]}),$("uf").value==="PI"?"Teresina":null);loadStations()})}
function brl(v){return "R$ "+v.toFixed(2).replace(".",",")}
function dist(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function loadStations(){
var q=encodeURIComponent($("city").value+", "+$("uf").value);
fetch("/api/stations?city="+q).then(function(r){return r.json()}).then(function(l){st.rows=l;render()}).catch(function(){st.rows=[];render()})}
function render(){
var f=st.fuel,fn=f.toUpperCase();
var rows=st.rows.filter(function(s){return s.prices&&s.prices[f]!=null}).map(function(s){
return{s:s,p:s.prices[f],d:st.pos?dist(st.pos[0],st.pos[1],s.lat,s.lng):null}}).sort(function(a,b){return a.p-b.p});
var min=rows.length?rows[0].p:0;
$("list").innerHTML=rows.length?rows.map(function(r){var s=r.s;
var u="https://www.google.com/maps/dir/?api=1&destination="+s.lat+","+s.lng;
return '<div class="card'+(r.p===min?' best':'')+'"><div class="ic">⛽</div><div class="inf"><div class="n">'+s.name+(s.promo?'<span class="tag">Promo</span>':'')+'</div><div class="s">'+s.address+' · '+s.brand+(r.d!=null?' · '+r.d.toFixed(1).replace(".",",")+' km':'')+'</div><a href="'+u+'" target="_blank" rel="noopener">Como chegar →</a></div><div class="pr"><small>'+fn+'</small><b>'+brl(r.p)+'</b></div></div>'}).join(""):'<p class="s">Nenhum posto cadastrado nesta cidade ainda.</p>';
$("fuels").innerHTML=FUELS.map(function(x){return '<button class="chip'+(x[1]===f?' on':'')+'" data-f="'+x[1]+'">'+x[0]+'</button>'}).join("");
var pr=st.rows.filter(function(s){return s.promo});
$("promos").innerHTML=pr.length?pr.map(function(s){return '<div class="card"><span class="badge">Promo</span><div class="inf"><div class="n">'+s.name+'</div><div class="s">'+s.address+'</div></div></div>'}).join(""):'<p class="s">Sem promoções nesta cidade.</p>'}
$("uf").onchange=loadCities;
$("city").onchange=loadStations;
$("fuels").onclick=function(e){var f=e.target.getAttribute("data-f");if(f){st.fuel=f;render()}};
document.querySelector("nav").onclick=function(e){var b=e.target.closest("button");if(!b)return;
document.querySelectorAll("nav button").forEach(function(x){x.className=x===b?"on":""});
["tabMapa","tabPromo"].forEach(function(t){$(t).className=t===b.getAttribute("data-t")?"":"hide"})};
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(function(p){st.pos=[p.coords.latitude,p.coords.longitude];render()},function(){});
loadUF();
</script>
<script src="patrocinadores.js"></script>
</body>
</html>
